[package]
name = "novara-core"
version = "0.1.0"
edition = "2024"

[dependencies]
curve25519-dalek = { version = "=4.1.3", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false }
sha2 = "0.10"
tendermint-abci = "=0.41.0"
tendermint-proto = "=0.41.0"

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["signature"] }
